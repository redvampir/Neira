<!-- neira:meta
id: NEI-20240709-183100-ui-localization
intent: feature
summary: |
  Полностью локализовал веб-интерфейс Нейры на русский язык и обновил подписи.
-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нейра — Пульт управления</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
            background: #1e1e1e;
            color: #ffffff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }
        .button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
            transition: background 0.3s;
        }
        .button:hover {
            background: #106ebe;
        }
        .metrics {
            font-family: monospace;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            margin-left: 10px;
        }
        .status.online {
            background: #107c10;
        }
        .status.offline {
            background: #d83b01;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .messages {
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 5px;
        }
        .message {
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 5px;
        }
        .user-message {
            background: #0078d4;
            align-self: flex-end;
        }
        .bot-message {
            background: #3a3a3a;
            align-self: flex-start;
        }
        .error-message {
            background: #8b0000;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        #messageInput {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #3a3a3a;
            color: white;
        }
        @media (max-width: 600px) {
            .button { width: 100%; margin: 5px 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Нейра<span id="status" class="status">Проверяем связь...</span></h1>
            <p>Этот пульт помогает следить за метриками обучения и вести диалог с Нейрой.</p>
        </div>

        <div class="card">
            <h2>Тренировочный контур</h2>
            <button class="button" onclick="sendAttempt(true)">Засчитать успешную попытку</button>
            <button class="button" onclick="sendAttempt(false)">Засчитать неудачную попытку</button>
            <p>Текущий уровень сложности: <span id="difficulty">0.50</span></p>
        </div>

        <div class="card">
            <h2>Системные метрики</h2>
            <pre class="metrics" id="metrics">Загружаем метрики...</pre>
        </div>

        <div class="card">
            <h2>Диалог с Нейрой</h2>
            <div class="chat-container" id="chat">
                <div class="messages" id="messages"></div>
                <div class="input-container">
                    <input type="text" id="messageInput" placeholder="Введите сообщение..." autocomplete="off">
                    <button class="button" onclick="sendMessage()">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';

        async function updateMetrics() {
            try {
                const response = await fetch(`${API_URL}/metrics`);
                const text = await response.text();
                document.getElementById('metrics').textContent = text;

                const status = document.getElementById('status');
                status.textContent = 'Онлайн';
                status.className = 'status online';
            } catch (error) {
                const status = document.getElementById('status');
                status.textContent = 'Оффлайн';
                status.className = 'status offline';
            }
        }

        async function sendAttempt(success) {
            try {
                const response = await fetch(`${API_URL}/training/attempt`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        success,
                        difficulty: parseFloat(document.getElementById('difficulty').textContent)
                    })
                });
                if (!response.ok) {
                    throw new Error('Сервер отклонил запрос');
                }
                const data = await response.json();
                document.getElementById('difficulty').textContent = data.new_difficulty.toFixed(2);
                updateMetrics();
            } catch (error) {
                console.error('Ошибка при фиксации попытки:', error);
            }
        }

        function appendMessage(content, cssClass) {
            const messages = document.getElementById('messages');
            const node = document.createElement('div');
            node.className = `message ${cssClass}`;
            node.textContent = content;
            messages.appendChild(node);
            messages.scrollTop = messages.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) {
                return;
            }

            appendMessage(text, 'user-message');
            input.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    throw new Error('Не удалось получить ответ от сервера');
                }

                const data = await response.json();
                appendMessage(data.response, 'bot-message');

                if (data.current_difficulty) {
                    document.getElementById('difficulty').textContent =
                        data.current_difficulty.toFixed(2);
                }
            } catch (error) {
                console.error('Ошибка при отправке сообщения:', error);
                appendMessage(`Ошибка: ${error.message}`, 'error-message');
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        updateMetrics();
        setInterval(updateMetrics, 5000);
    </script>
</body>
</html>
