[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
once_cell = "1.19"
regex = "1"
toml = "0.8"
tracing = "0.1"
metrics = "0.23"
prometheus = "0.13"
quick-xml = { version = "0.31", features = ["serialize", "overlapped-lists", "encoding", "serde"] }
jsonschema-valid = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process"] }
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
lru = "0.12"
notify = "6"
parking_lot = "0.12"
sha2 = "0.10"
flate2 = "1"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = true, features = ["json", "gzip", "brotli", "deflate", "stream"] }
syn = { version = "2", features = ["full"] }
walkdir = "2"
quote = "1"
axum = { version = "0.7", features = ["macros", "http1", "json", "ws"] }
base64 = "0.22"
async-trait = "0.1"
sysinfo = "0.37"
jsonpath_lib = "0.3"
strsim = "0.11"

tracing-subscriber = "0.3"
metrics-exporter-prometheus = "0.12"
tower-http = { version = "0.6", features = ["cors", "trace"] }
async-stream = "0.3"
futures-core = "0.3"
dotenvy = "0.15"
[dev-dependencies]
serial_test = "2"
tempfile = "3"
