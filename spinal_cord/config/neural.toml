[network]
# Максимальное количество одновременных сигналов
max_concurrent_signals = 1000

# Приоритеты сигналов
[priorities]
alert = 3      # Тревога
command = 2    # Команда 
feedback = 1   # Обратная связь

# Настройки синапсов
[synapses]
min_strength = 0.1
max_strength = 1.0
learning_rate = 0.01
