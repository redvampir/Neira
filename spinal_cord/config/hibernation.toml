# Конфигурация гибернации органов

[timing]
# Время бездействия до гибернации (секунды)
idle_timeout = 300  # 5 минут

# Задержка пробуждения (миллисекунды)
wake_up_delay = 100

[resources]
# Минимальный порог свободной памяти для активации
min_memory_threshold = 0.2  # 20%

# Приоритеты гибернации
[priorities]
sensory_organs = 1   # Первые кандидаты на сон
processors = 2       # Средний приоритет
memory_cells = 3     # Последние кандидаты
