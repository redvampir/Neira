[evolution]
# Порог перегрузки для разделения органа
split_threshold = 0.85

# Порог недогрузки для слияния
merge_threshold = 0.15

# Минимальное время работы до эволюции (часы)
min_lifetime = 24

[cooperation]
# Максимальное количество органов-помощников
max_helpers = 3

# Минимальный размер передаваемой нагрузки
min_load_portion = 0.2

[monitoring]
# Интервал проверки здоровья (секунды)
health_check_interval = 60

# Порог для запуска восстановления
repair_threshold = 0.7
